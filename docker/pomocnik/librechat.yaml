# Pomocnik: LibreChat configuration (baked into the image, CONFIG_PATH=/app/pomocnik/librechat.yaml).
# No secrets here: ${VAR} values come from the environment (SealedSecret in platform-gitops).
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.17

cache: true

interface:
  customWelcome: 'Witaj w Pomocniku!'

registration:
  socialLogins: []

endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'anthropic/claude-sonnet-5.5'
          - 'anthropic/claude-opus-5.5'
          - 'deepseek/deepseek-v4.1-flash'
          - 'google/gemini-3.8-flash'
        fetch: true
      titleConvo: true
      titleModel: 'deepseek/deepseek-v4.1-flash'
      # OpenRouter models use various stop tokens.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

# MCP: the "browser" component (docker/browser, Playwright MCP). Internal address, so it must be
# trusted before LibreChat's private-IP (SSRF) check.
mcpSettings:
  allowedAddresses:
    - 'browser:8931'

mcpServers:
  browser:
    title: 'Przeglądarka'
    description: 'Przeglądarka internetowa (Playwright): otwieranie stron, klikanie, wypełnianie formularzy, zrzuty ekranu.'
    type: streamable-http
    url: 'http://browser:8931/mcp'
    # A per-user placeholder makes LibreChat open one MCP connection per user (not a shared app
    # connection); the server gives every connection its own in-memory browser context.
    headers:
      X-Pomocnik-User: '{{LIBRECHAT_USER_ID}}'
    initTimeout: 30000
    timeout: 120000
    serverInstructions: true
