# Pomocnik: LibreChat configuration (baked into the image, CONFIG_PATH=/app/pomocnik/librechat.yaml).
# No secrets here: ${VAR} values come from the environment (SealedSecret in platform-gitops).
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.17

cache: true

interface:
  customWelcome: 'Witaj w Pomocniku!'

registration:
  socialLogins: []

endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'anthropic/claude-sonnet-5.5'
          - 'anthropic/claude-opus-5.5'
          - 'deepseek/deepseek-v4.1-flash'
          - 'google/gemini-3.8-flash'
        fetch: true
      titleConvo: true
      titleModel: 'deepseek/deepseek-v4.1-flash'
      # OpenRouter models use various stop tokens.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

# Memory: agents with the "Memory" tool and memory scope "agent" keep short notes per (user, agent)
# (set_memory / delete_memory), added to the context of every new conversation. No memory agent:
# nothing runs in the background after each message. Users see and edit them in Settings >
# Personalization.
memory:
  tokenLimit: 4000
  personalize: true

# MCP: the "browser" component (docker/browser, Playwright MCP). Internal address, so it must be
# trusted before LibreChat's private-IP (SSRF) check.
mcpSettings:
  allowedAddresses:
    - 'browser:8931'
    - 'sejf:8932'
    - 'ssh:8933'

mcpServers:
  browser:
    title: 'Przeglądarka'
    description: 'Przeglądarka internetowa (Playwright): otwieranie stron, klikanie, wypełnianie formularzy, zrzuty ekranu.'
    type: streamable-http
    url: 'http://browser:8931/mcp'
    # A per-user placeholder makes LibreChat open one MCP connection per user (not a shared app
    # connection); the server gives every connection its own in-memory browser context.
    headers:
      X-Pomocnik-User: '{{LIBRECHAT_USER_ID}}'
    initTimeout: 30000
    timeout: 120000
    serverInstructions: true

  # The browser with a client's secrets (docker/sejf in front of "browser"): the agent types a
  # password by its NAME, sejf substitutes the value on allowed pages (SEJF_ORIGINS) and redacts it
  # from every response. The secrets are set by an admin (Admin Panel > Users > Secrets; API
  # /api/admin/users/:id/secrets), stored encrypted per user; users cannot change them
  # (api/server/services/Pomocnik/clientSecrets.js). Only for agents that need them, not in the chat menu.
  sejf:
    title: 'Przeglądarka z sejfem'
    description: 'Przeglądarka, która wpisuje hasła klienta (podawane nazwą, np. PANEL_HASLO) tylko na dozwolonych stronach; model nie widzi haseł.'
    type: streamable-http
    url: 'http://sejf:8932/mcp'
    headers:
      X-Pomocnik-User: '{{LIBRECHAT_USER_ID}}'
      X-Pomocnik-Secrets: '{{POMOCNIK_SECRETS}}'
    customUserVars:
      POMOCNIK_SECRETS:
        title: 'Sejf (ustawia administrator)'
        description: 'Dane dostępowe ustawia administrator Pomocnika.'
    chatMenu: false
    initTimeout: 30000
    timeout: 120000
    serverInstructions: true

  # SSH to a client's servers (docker/sejf/ssh.mjs) with keys from the same admin-set secrets
  # (SSH_<X>_ADDR / _KEY / _HOSTKEY); outputs redacted. Long timeout for ssh_copy (site migrations).
  ssh:
    title: 'Serwery SSH klienta'
    description: 'Polecenia powłoki i kopiowanie plików między serwerami klienta przez SSH; klucze są poza zasięgiem modelu.'
    type: streamable-http
    url: 'http://ssh:8933/mcp'
    headers:
      X-Pomocnik-User: '{{LIBRECHAT_USER_ID}}'
      X-Pomocnik-Secrets: '{{POMOCNIK_SECRETS}}'
    customUserVars:
      POMOCNIK_SECRETS:
        title: 'Sejf (ustawia administrator)'
        description: 'Dane dostępowe ustawia administrator Pomocnika.'
    chatMenu: false
    initTimeout: 30000
    timeout: 1800000
    serverInstructions: true
